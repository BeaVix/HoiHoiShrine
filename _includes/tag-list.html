<style>
    .tags-list{
        display: grid;
        grid-template-columns: 33% 33% 33%;
        padding-bottom: 10px;
    }
    .tags ul{
        list-style-type: disc;
    }
</style>

<h2>Tags</h2>
<div class="tags">
    <ul class="tags-list">
    {% for tag in site.data.image_tags %}
        <li>
            <a href="{{site.url}}/{{page.dir}}/{{tag.name | replace: " ", "_"}}.html">{{tag.name}}</a>
        </li>
    {% endfor %}
    </ul>
</div>
